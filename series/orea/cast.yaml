# SERIES CAST — Orea
#
# The single source of truth for who these people are. Every book in the
# series references this file by id; no book re-describes a character.
# Add a character here the first time they appear, and every later book gets
# them for free, looking the same.
#
# id       — how books refer to them. Unique, lower case, never reused.
# name     — exactly as spelled in the text. Never varies.
# sheet    — the approved character sheet, in series/<series>/charsheet/.
#            Characters who share a sheet name the same file.
# wardrobe — what they wear, by named outfit. Clothing is a property of the
#            day, not of the person, so it lives here and not in description.
#            A book picks one outfit in its story_world.yaml; a setting or a
#            single page may override it. Add a new outfit here once and every
#            later book can use it.
# reference— an existing illustration to use as the likeness reference when
#            generating that character's sheet. Path is relative to the repo
#            root. Leave out if the character has no picture yet.

series: Orea

cast:
  orea:
    name: Orea
    lead: true
    # Orea alone. She and Whoof-Whoof used to share one sheet, which meant any
    # page without the toy still had a picture of the toy attached to it — and
    # a reference beats an instruction every time.
    sheet: charsheet_orea.png
    reference: series/orea/charsheet/charsheet_orea.png
    description: >
      A girl of four. Blonde wavy shoulder-length hair, rosy cheeks, blue eyes.
      Small for her age, sturdy, with a round face.
    wardrobe:
      night: >
        plain pale blue button-up pyjamas, barefoot
      summer: >
        a light violet cotton country knee-length dress with short puffed sleeves and a small
        collar, white ankle socks and brown t-bar shoes
      autumn: >
        the beige dress and pink cardigan over it, brown boots
      winter: >
        a warm buttoned coat over the dusty mauve-pink dress, a knitted hat,
        mittens, thick tights and brown boots
      rain: >
        a yellow raincoat with the hood down, and green wellington boots
    sheet_views:
      - standing, full body, facing forward
      - standing, full body, in profile facing left
      - head and shoulders, larger, facing forward

  whoof:
    name: Whoof-Whoof
    companion_of: orea
    # NOT constant. He was, and it forced "appears in every illustration" into
    # every prompt, which put him in a child's arms while she was cheerfully
    # asking about ducks. He is not a prop she carries; he is what she reaches
    # for. Put him in frame at home, at play, and at the moments she has to get
    # through something — and leave him out of the ordinary ones, so that the
    # page where she picks him up means something.
    sheet: charsheet_dog.png
    reference: series/orea/charsheet/charsheet_dog.png
    description: >
      A soft beige stuffed toy dog with very long floppy ears, a small black
      nose, a red collar, and a small navy blue bow on the top of his head.
    sheet_views:
      - sitting on its own, facing forward
      - lying on its own, on its side
    rules:
      - Whoof-Whoof is never lost, never dropped, never swapped for another
        toy, never damaged.
      - When he is in frame he is always the same toy, with the red collar and
        the navy bow.

  mum:
    name: Mum
    sheet: charsheet_mum.png
    reference: series/orea/charsheet/charsheet_mum.png
    description: >
      Orea's mother. A woman in her thirties, with shoulder-length wavy
      chestnut-brown hair, fair skin and blue eyes. Calm, warm, unhurried. She
      is called only Mum and has no other name.
    wardrobe:
      night: >
        a soft dusty-pink knitted jumper and blue jeans, with plain tan loafers
      summer: >
        a pale linen shirt with the sleeves turned back, blue jeans and plain
        tan loafers
      autumn: >
        a soft dusty-pink knitted jumper and blue jeans, with plain tan loafers
      winter: >
        a long grey wool coat over the dusty-pink jumper, and brown boots
      rain: >
        a navy raincoat over the dusty-pink jumper, and brown boots
    sheet_views:
      - standing, full body, facing forward
      - seated on the edge of a bed, upper body, in three-quarter view, leaning
        slightly towards a child
      - head and shoulders, larger, facing forward, smiling gently

  dentist:
    name: the dentist
    sheet: charsheet_dentist.png
    reference: series/orea/charsheet/charsheet_dentist.png
    description: >
      A woman with shoulder-length dark hair and crinkly, smiling blue eyes.
      Friendly and a little playful. She never wears a mask over her face in
      any illustration.
    wardrobe:
      # She is at work in every book she appears in, so every outfit is the
      # same one. Named entries still have to exist or the book cannot resolve
      # hers.
      night:  &work a pale pink tunic and a soft clinical cap
      summer: *work
      autumn: *work
      winter: *work
      rain:   *work
    sheet_views:
      - standing, full body, facing forward
      - head and shoulders, larger, facing forward, smiling
