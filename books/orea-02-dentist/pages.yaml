# STRUCTURE ONLY — no story text lives here. Text is in text/<lang>.yaml,
# keyed by the same page numbers. Art direction is in style.yaml.
#
# characters — who is in frame on this page, by id from the series cast.
#              Everyone here is described and dressed in the prompt.
# sheets  — optional: which of those need a reference sheet attached. Defaults
#           to all of `characters`. A person who is only a hand or a pair of
#           legs at the frame edge has no face to keep consistent, so leaving
#           them out here buys back an attachment slot.
#              `[]` means nobody is in frame.
# setting — which place from story_world.yaml this page happens in
# shot   — how close: wide | medium | close | detail
# angle  — where from: eye_level | low | high | from_behind | from_doorway |
#          from_pillow | side | three_quarter
#
# RULE: a shot may repeat on consecutive pages, but not from the same angle.
#
# scene  — a DESCRIPTION of the picture, never the story. Every field must be
#          something a painter could see. No thoughts, no memory, no future
#          tense, no characters who are not in the frame.
#          Characters other than Orea go inside subject/action/gaze/expression,
#          separated by semicolons — there is no field of their own.

pages:
  - n: 1
    image: page_01.png
    characters: [orea, mum]
    setting: park
    shot: wide
    angle: eye_level
    scene:
      subject: Orea and Mum walking together toward the viewer, both whole and
        full length, both faces visible and turned toward each other; Orea in
        the right half, small; Mum in the left half, taller; the gap between
        them narrow.
      action: Orea walking with her face tipped up toward Mum, one arm swinging
        free at her side, the other hand held in Mum's; Mum looking down at
        Orea, her head inclined toward her; both mid-stride, coming down the
        path toward the front of the picture
      gaze: Orea's eyes up at Mum's face; Mum's eyes down at Orea's face; the
        two lines of sight meeting between them
      expression: Orea's mouth open mid-question, eyebrows lifted, cheeks
        round; Mum's mouth curved in a small listening smile, eyes soft
      light: bright afternoon sun from high and slightly behind them, warm and
        pale, the whole scene high-key, their faces in gentle open shade
      shadow: two soft shadows cast forward from their feet toward the viewer
        along the paving
      place: pale paving path running from behind them toward the front of the
        picture, mown grass either side, low black railings, broad pale trees
        kept soft, the gate small and distant behind their shoulders
      state: daylight, dry ground, no bench in frame, no toy in frame

  - n: 2
    image: page_02.png
    characters: [orea]
    sheets: [orea]
    setting: park
    shot: close
    angle: low
    scene:
      subject: Orea's head and shoulders large in the lower left of the frame,
        her body turned slightly away and her chin lifted; the upper right of
        the frame given over to a soft-edged watercolour thought cloud rising
        from beside her head, drawn as three small round puffs leading up into
        one larger soft shape
      action: one hand come up to hold the small white collar of her dress,
        fingers curled; her shoulders slightly raised; she is not walking
      gaze: her eyes turned up and away to her right, focused on nothing in the
        park
      expression: brows drawn a little together, lips pressed thin, the corners
        of her mouth turned down, a small vertical crease between the brows
      light: bright afternoon daylight from the left, warm on her cheek and in
        her hair; inside the thought cloud, plain even light with no shadows
        and nothing dramatic
      shadow: a soft shadow under her chin and along her jaw; nothing inside
        the thought cloud casts a shadow
      place: the park behind her reduced to pale soft washes, a suggestion of
        grass and trees only, nothing resolved; inside the thought cloud, one
        thing only — a woman doctor standing simply, facing the viewer, whole
        and full length, in a plain pale uniform tunic, hands relaxed at her
        sides, her face calm and pleasant and quite ordinary. No room around
        her, no chair, no lamp, no equipment, no furniture, nothing else at all
      state: daylight, Orea alone in the picture, no toy in frame, no other
        real person in frame; the thought cloud is painted in the same soft
        watercolour and the same gentle colours as the rest of the picture,
        only a little cooler — it is never grey, never dark, never a
        silhouette, and the figure in it is never turned away

