# Russian text. Keys are page numbers and must match pages.yaml.

title: "Спокойной ночи, Орея."

pages:
  1: >
    Орея — смелая девочка. Она уже большая и спит одна в своей комнате.
    Кровать у неё мягкая и уютная, а рядом с ней каждую ночь спит маленький
    бежевый пёсик Аф-аф. Но сегодня Орея не хочет засыпать одна. Что
    случилось, Орея?

  2: >
    Мама приходит пожелать спокойной ночи. Орея лежит в кроватке, но ей не
    хочется, чтобы мама уходила. Она боится теней, которые появляются на
    стенах каждую ночь, когда гаснет лампа. «У всех бывают страхи, и это
    совершенно нормально, — говорит мама. — Тень — это просто свет, которому
    что-то мешает. Если станет страшно, ты можешь включить лампу».

  3: >
    Мамины шаги затихают на лестнице. Лампа погасла, и в комнате темно и тихо.
    И вот она — на стене у двери. Высокая, тонкая, с длинными руками. Она чуть
    двигается, замирает и двигается снова. Орея натягивает одеяло до
    подбородка. Сердце стучит очень быстро. Ах, Орея…

  4: >
    Мама и папа внизу. Стоит только позвать — и они придут. Орея это знает. Но
    сегодня Орее хочется узнать кое-что самой. «Держись за меня», — говорит она
    Аф-афу и протягивает руку в темноту.

  5: >
    Щёлк. Тёплый свет осветил комнату, и стена снова становится просто
    обыкновенной стеной. Высокой тени больше нет. Орея медленно выдыхает. «Ты
    видел, Аф-аф?»

  6: >
    Орея слезает с кровати, берёт Аф-афа в руку и приоткрывает дверь. Тонкая
    полоска света из коридора ложится на пол рядом с ней. Вот так. Так лучше.

  7: >
    А теперь самое смелое. Орея возвращается к сиреневому столику и выключает
    лампу. Тень появляется снова — конечно, появляется. Но теперь она меньше и
    мягче, и уже не пугает так, как раньше. Орея смотрит в окно, а за ним
    дерево качает ветками на ветру. «Так вот кто это был», — говорит Орея.

  8: >
    Орея забирается в свою кроватку и натягивает одеяло. Дверь приоткрыта, и
    свет тихо лежит на полу. Завтра ночью тень придёт опять — и Орея будет
    знать, как её зовут. Она прижимает Аф-афа поближе, глаза закрываются, и в
    комнате тихо. Спокойной ночи, Орея. Спокойной ночи, Аф-аф.
