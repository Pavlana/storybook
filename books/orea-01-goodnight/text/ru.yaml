# Russian text. Keys are page numbers and must match pages.yaml.
# Retranslated from the final English, 2026. Dialogue uses the Russian
# em-dash convention rather than quotation marks.

title: "Спокойной ночи, Орея."

pages:
  1: |
    Орея подросла. Она уже сама надевает ботинки и может пронести полную
    чашку молока через всю кухню, не пролив ни капли. А сегодня Орея
    будет спать в своей комнате одна.

    Правда, не совсем одна. Аф-аф, конечно, пойдёт с ней. Он всегда идёт с ней. Такой уж он
    пёс.

    Быть храброй легко, особенно при свете лампы.

  2: |
    Мама приходит пожелать спокойной ночи и поцеловать на ночь.

    — Мам, — говорит Орея. — А если мне станет страшно?

    — Страшно от чего? — спрашивает мама и садится на край кровати.

    — От фигур, — говорит Орея. — На стене. Когда темно.

    — А-а, — говорит мама. — Да. Ночью бывает страшно. — Она поправляет
    одеяло. — Если тебе страшно — включи лампу. Она для этого и стоит.

    Мама целует дочь в макушку.

    — И помни. Даже когда ты меня не видишь, я всё равно рядом, в соседней
    комнате.

    Мама уходит, и дверь тихо закрывается.

  3: |
    В комнате темно и тихо, за окном ветер качает деревья и лишь длинное ухо
    Аф-афа прячется в одеяле.

    Но вдруг появляется ЭТО.

    На стене у двери что-то есть. Что-то высокое, тонкое, с длинными
    руками, которые тянутся вверх и вверх, почти до потолка, — и они шевелятся.
    Медленно. Туда, потом сюда, потом опять туда.

  4: |
    Орея крепко-крепко прижимает Аф-афа к себе.

    Может, позвать маму? Мама придёт, и всё закончится в эту же
    секунду.

    — Держись за меня, — шепчет она Аф-афу. — Мне кажется, я знаю, что делать.

    И она протягивает руку в темноту.

  5: |
    Щёлк.

    — Ты видел? — говорит Орея. Аф-аф ничего не отвечает. Но Орея уверена, что он тоже заметил.

    Это стена. Просто стена. Белая, ровная и самая обыкновенная, и на ней
    совсем ничего нет.

  6: |
    — У меня есть идея, — говорит Орея.

    Она неторопливо слезает с кровати, посматривая на стену, затем медленно идёт к двери, чтобы впустить тонкую полоску
    света в комнату.

    Вот так.

    Теперь мама немножко ближе.

  7: |
    — А если я выключу лампу, — говорит она Аф-афу, — ЭТО вернётся?

    Щёлк…

    ОНО тут как тут. Правда, теперь меньше, и мягче, и уже совсем
    не такое, как раньше.

    За окном, в саду, стих ветер. Дерево медленно качает ветками — туда,
    сюда, и время от времени они тихонько стучат по стеклу.

    — Ах вот это кто, — говорит Орея. — Это был ты всё это время.

  8: |
    Орея забирается обратно в свою кровать и натягивает одеяло до подбородка.

    Тень всё ещё на стене. Она будет там и завтра ночью, потому что так бывает, когда светит луна.

    Но теперь у неё есть имя. И дверь приоткрыта. И Аф-аф там же, где всегда,
    рядышком.

    — Спокойной ночи, Аф-аф, — говорит Орея.

    Спокойной ночи, Орея.
