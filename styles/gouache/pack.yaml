name: Gouache
reference: reference.png
style: >
  Opaque gouache on toned paper. Flat matte colour laid in confident shapes,
  visible brush marks, slightly chalky surface, restrained mid-century palette
  with warm neutrals. Little blending; form built from adjacent blocks of tone.
edges: >
  Fill the frame edge to edge, the painted surface reaching all four sides.
  Hard rectangular border, no vignette.
