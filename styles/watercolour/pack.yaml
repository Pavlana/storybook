name: Watercolour
reference: reference.png
style: >
  Traditional watercolour on textured paper with visible paper grain, soft
  pigment bleed at the edges of each wash, and fine ink linework over the
  colour. Muted natural colours, gentle realism, warm and calm. Early
  twentieth-century English picture book tradition.
edges: >
  Paint the illustration as a watercolour vignette on a white ground — the wash
  fades softly and irregularly at all four edges, with no hard rectangular
  border and no content running to the edge.
